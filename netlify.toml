# Netlify config — PeptBiohacking Marketing Site (peptbiohacking.com)
# Deploy Previews: auto-built for every branch pushed to GitHub
# Preview URL pattern: https://{branch-name}--elev8ed-peptbiohack.netlify.app

[build]
  publish = "."

[build.processing]
  skip_processing = false

# Deploy Preview: ALL branches get preview URLs automatically
[context.deploy-preview]
  publish = "."

# Branch Deploy: same as preview
[context.branch-deploy]
  publish = "."

# Retire the legacy password-based inventory and pricing pages. Inventory
# management now lives behind the authenticated doctor portal.
[[redirects]]
  from = "/inventario"
  to = "https://peptbiohacking.mx/doctor/inventario"
  status = 302
  force = true

[[redirects]]
  from = "/inventario.html"
  to = "https://peptbiohacking.mx/doctor/inventario"
  status = 302
  force = true

[[redirects]]
  from = "/precios"
  to = "https://peptbiohacking.mx/doctor/inventario"
  status = 302
  force = true

[[redirects]]
  from = "/precios.html"
  to = "https://peptbiohacking.mx/doctor/inventario"
  status = 302
  force = true
