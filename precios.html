<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PepBiohacking — Asignar Precios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0F1B29;--teal:#2A7C6F;--teal2:#349E8E;--gold:#C8963E;--ice:#E8F0F2;--muted:#7B94A5;--red:#DC4A5A;--green:#3EAD7A;--border:rgba(255,255,255,.08);--card:rgba(255,255,255,.04)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--navy);color:var(--ice);font-family:'Outfit',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:40px 20px}
.container{max-width:680px;width:100%}
h1{font-size:22px;font-weight:300;letter-spacing:.04em;margin-bottom:4px}
h1 b{color:var(--gold);font-weight:600}
.sub{font-size:12px;color:var(--muted);margin-bottom:28px}
.gate{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;text-align:center;margin-bottom:24px}
.gate.hide{display:none}
.gate label{font-size:13px;color:var(--muted);display:block;margin-bottom:10px}
.gate input{padding:10px 14px;background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:8px;color:var(--ice);font-size:14px;text-align:center;outline:none;width:180px;letter-spacing:.3em;font-family:'Outfit',sans-serif}
.gate input:focus{border-color:var(--teal)}
.gate .err{color:var(--red);font-size:11px;margin-top:8px;display:none}
.dash{display:none}
.dash.show{display:block;animation:fadeIn .5s ease both}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.info{background:rgba(42,124,111,.1);border:1px solid rgba(42,124,111,.25);border-radius:10px;padding:14px 18px;font-size:12px;color:var(--teal);margin-bottom:20px;line-height:1.6}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px 20px;margin-bottom:12px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.card .info{flex:1;min-width:200px;margin:0}
.card .name{font-size:14px;font-weight:500}
.card .stock{font-size:11px;color:var(--muted)}
.card .input-wrap{display:flex;align-items:center;gap:8px}
.card .input-wrap span{font-size:11px;color:var(--muted)}
.card input[type=number]{width:120px;padding:9px 12px;background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:8px;color:var(--ice);font-size:14px;text-align:right;outline:none;font-family:'Outfit',sans-serif}
.card input[type=number]:focus{border-color:var(--teal)}
.card input[type=number]::placeholder{color:#555}
.card .status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.card .status-dot.red{background:var(--red)}
.card .status-dot.amber{background:var(--gold)}
.btn{padding:12px 28px;border-radius:8px;border:1px solid var(--teal);background:var(--teal);color:var(--ice);font-size:13px;font-weight:600;cursor:pointer;letter-spacing:.1em;transition:all .25s;font-family:'Outfit',sans-serif;display:block;width:100%;margin-top:16px}
.btn:hover{background:var(--teal2);box-shadow:0 0 20px rgba(42,124,111,.4)}
.btn:disabled{opacity:.4;pointer-events:none}
.result{display:none;background:rgba(62,173,122,.1);border:1px solid rgba(62,173,122,.3);border-radius:10px;padding:16px 20px;margin-top:16px;font-size:13px;line-height:1.8}
.result.show{display:block;animation:fadeIn .4s ease both}
.result .ok{color:var(--green)}
.result .err{color:var(--red)}
.help{text-align:center;margin-top:24px;font-size:11px;color:var(--muted)}
@media(max-width:500px){.card{flex-direction:column;align-items:stretch}.card .input-wrap{justify-content:flex-end}}
</style>
</head>
<body>
<div class="container">
  <h1>Pep<b>Biohacking</b></h1>
  <div class="sub">Asignar precios a productos nuevos</div>

  <!-- Passcode gate -->
  <div class="gate" id="gate">
    <label>Código de acceso</label>
    <input id="pw" type="password" placeholder="••••••••" autocomplete="off">
    <div class="err" id="err">Código incorrecto</div>
    <button class="btn" style="margin-top:14px" onclick="unlock()">Entrar</button>
  </div>

  <!-- Dashboard -->
  <div class="dash" id="dash">
    <div class="info">
      📋 Estos productos tienen stock pero <b>no tienen precio asignado</b>.
      Escribe el precio en MXN y guarda. El checkout y el panel se actualizan al instante.
    </div>

    <div id="formList"></div>

    <button class="btn" id="saveBtn" onclick="saveAll()" disabled>💾 Guardar todos los precios</button>

    <div class="result" id="result"></div>

    <div class="help">Los precios se reflejan en la tienda y el inventario inmediatamente</div>
  </div>
</div>

<script>
var FN_URL = 'https://myymemctdxwizhmwjbyk.supabase.co/functions/v1/update-price';
var PASSCODE = 'PEPBIO2026';

// Products that need prices (from Airtable — stock > 0, price = 0)
var PRODUCTS = [
  { sku: 'ghk-cu-50',    name: 'GHK-Cu 50mg',           stock: 2  },
  { sku: 'nad-buffered', name: 'NAD+ Buffered',         stock: 5  },
  { sku: 'bpc-tb500-10', name: 'BPC-157/TB-500 10mg/10mg', stock: 15 },
  { sku: 'kisspeptin-10', name: 'Kisspeptin 10mg',       stock: 15 },
  { sku: 'igf1-lr3-100', name: 'IGF-1 LR3 100mg',       stock: 0  },
];

var unlocked = false;

function unlock() {
  var pw = document.getElementById('pw').value.trim().toUpperCase();
  if (pw === PASSCODE) {
    document.getElementById('gate').classList.add('hide');
    document.getElementById('dash').classList.add('show');
    unlocked = true;
    renderForm();
  } else {
    document.getElementById('err').style.display = 'block';
    document.getElementById('pw').value = '';
    setTimeout(function() { document.getElementById('err').style.display = 'none'; }, 1500);
  }
}

document.getElementById('pw').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') unlock();
});

function renderForm() {
  var html = '';
  PRODUCTS.forEach(function(p) {
    html += '<div class="card" data-sku="' + p.sku + '">';
    html += '  <span class="status-dot ' + (p.stock > 0 ? 'amber' : 'red') + '"></span>';
    html += '  <div class="info">';
    html += '    <div class="name">' + p.name + '</div>';
    html += '    <div class="stock">Stock: ' + p.stock + ' unidades</div>';
    html += '  </div>';
    html += '  <div class="input-wrap">';
    html += '    <span>MXN $</span>';
    html += '    <input type="number" min="0" step="100" placeholder="0" id="price-' + p.sku + '" oninput="checkForm()">';
    html += '  </div>';
    html += '</div>';
  });
  document.getElementById('formList').innerHTML = html;
}

function checkForm() {
  var anyFilled = false;
  PRODUCTS.forEach(function(p) {
    var val = document.getElementById('price-' + p.sku);
    if (val && Number(val.value) > 0) anyFilled = true;
  });
  document.getElementById('saveBtn').disabled = !anyFilled;
}

function saveAll() {
  var btn = document.getElementById('saveBtn');
  btn.disabled = true;
  btn.textContent = 'Guardando...';

  var results = document.getElementById('result');
  results.className = 'result';
  results.innerHTML = '';

  var promises = [];
  PRODUCTS.forEach(function(p) {
    var input = document.getElementById('price-' + p.sku);
    var price = input ? Number(input.value) : 0;
    if (price > 0) {
      promises.push(
        fetch(FN_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sku: p.sku, price: price, passcode: PASSCODE })
        }).then(function(r) { return r.json(); })
      );
    }
  });

  if (promises.length === 0) {
    btn.textContent = '💾 Guardar todos los precios';
    btn.disabled = false;
    return;
  }

  Promise.all(promises).then(function(responses) {
    var ok = [], errors = [];
    responses.forEach(function(r) {
      if (r.success) ok.push(r.message);
      else errors.push(r.error || 'Error desconocido');
    });

    var html = '';
    if (ok.length > 0) {
      html += '<div class="ok">✅ ' + ok.length + ' producto(s) actualizado(s):</div>';
      html += '<div>' + ok.join('<br>') + '</div>';
    }
    if (errors.length > 0) {
      html += '<div class="err" style="margin-top:8px">❌ ' + errors.join('<br>') + '</div>';
    }
    results.innerHTML = html;
    results.classList.add('show');
    btn.textContent = '💾 Guardar todos los precios';
    btn.disabled = false;
    checkForm();
  }).catch(function(e) {
    results.innerHTML = '<div class="err">❌ Error de red: ' + e.message + '</div>';
    results.classList.add('show');
    btn.textContent = '💾 Guardar todos los precios';
    btn.disabled = false;
  });
}
</script>
</body>
</html>
